<div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden">
  <!-- Connection Header -->
  <div 
    (click)="onSelectConnection()" 
    class="p-6 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-200"
  >
    <div class="flex items-start justify-between">
      <div class="flex-1 min-w-0">
        <div class="flex items-center">
          <!-- Database Type Icon -->
         <div class="flex-shrink-0 w-10 h-10 bg-blue-100 dark:bg-blue-900 rounded-lg flex items-center justify-center mr-3">
            <span *ngIf="connection.dbType === 'mysql2'" class="icon-[logos--mysql] text-2xl"></span>
            <span *ngIf="connection.dbType === 'pg'" class="icon-[logos--postgresql] text-2xl"></span>
            <span *ngIf="connection.dbType === 'sqlite3'" class="icon-[vscode-icons--file-type-sqlite] text-2xl"></span>
            <span *ngIf="connection.dbType === 'mssql'" class="icon-[devicon--microsoftsqlserver] text-2xl"></span>
            <span *ngIf="connection.dbType === 'oracledb'" class="icon-[logos--oracle] text-2xl"></span>
            <span *ngIf="!['mysql2', 'pg', 'sqlite3', 'mssql', 'oracledb'].includes(connection.dbType)" class="icon-[mdi--database] text-2xl text-blue-600 dark:text-blue-400"></span>
          </div>
          
          <div class="flex-1 min-w-0">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white truncate">
              {{ connection.host }}:{{ connection.port }}
            </h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 truncate">
              {{ connection.username }}@{{ connection.dbType }}
            </p>
            <div *ngIf="connection.database" class="text-xs text-gray-400 dark:text-gray-500 truncate mt-1">
              Database: {{ connection.database }}
            </div>
          </div>
        </div>
        
        <!-- Connection Status -->
        <div class="mt-4 flex items-center">
          <div class="flex items-center">
            <div 
              class="w-2 h-2 rounded-full mr-2"
              [class]="getStatusColor(connection.status)"
            ></div>
            <span class="text-xs font-medium" [class]="getStatusTextColor(connection.status)">
              {{ getStatusText(connection.status) }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="px-6 py-3 bg-gray-50 dark:bg-gray-700 border-t border-gray-200 dark:border-gray-600">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button
          (click)="onEditConnection(); $event.stopPropagation()"
          class="inline-flex items-center px-3 py-1.5 border border-gray-300 dark:border-gray-600 shadow-sm text-xs font-medium rounded-md text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200"
        >
          <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
          </svg>
          Edit
        </button>
        
        <button
          (click)="onDeleteConnection(); $event.stopPropagation()"
          class="inline-flex items-center px-3 py-1.5 border border-red-300 dark:border-red-600 shadow-sm text-xs font-medium rounded-md text-red-700 dark:text-red-400 bg-white dark:bg-gray-800 hover:bg-red-50 dark:hover:bg-red-900/20 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors duration-200"
        >
          <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
          Delete
        </button>
      </div>
      
      <button
        (click)="onSelectConnection()"
        class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200"
      >
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
        Connect
      </button>
    </div>
  </div>
</div>
