<header class="border-base z-20 w-full border-b bg-white/20 py-2 backdrop-blur dark:bg-zinc-900/40">
    <div class="center container mx-auto flex h-full items-center justify-between">
        <div class=" flex items-center space-x-3"> 
        <app-logo></app-logo>
         <a
                *ngIf="connected"
                (click)="goToLanding()"
                class="flex items-center space-x-1 rounded-md px-4 py-1 bg-zinc-600 text-white rounded-md hover:bg-zinc-700 transition-colors duration-200"
            >
                <span>Servers</span>
            </a>
            </div>

        <div class=" flex items-center space-x-3"> 
            <button
                *ngIf="connected"
                class="relative flex h-8 w-20 items-center rounded-full bg-gray-200 transition-colors duration-300 focus:outline-none dark:bg-gray-700"
                (click)="toggleAI()"
            >
                <div
                    class="absolute h-6 w-6 rounded-full bg-white shadow-md transition-transform duration-300"
                    [ngClass]="aiEnabled ? 'bg-black-500 translate-x-12' : 'translate-x-1 bg-gray-400'"
                ></div>

                <span
                    class="absolute text-xs font-semibold transition-all duration-300"
                    [ngClass]="aiEnabled ? 'text-600 left-3 opacity-100' : 'left-3 text-gray-500 opacity-0'"
                >
                    AI ON
                </span>
                <span
                    class="absolute text-xs font-semibold transition-all duration-300"
                    [ngClass]="aiEnabled ? 'text-600 right-3 opacity-0' : 'right-3 text-gray-500 opacity-100'"
                >
                    AI OFF
                </span>
            </button>
            <a
                href="https://github.com/kshashikumar/mysql-gui"
                target="_blank"
                rel="noopener noreferrer"
                class="flex items-center space-x-1 rounded-md px-4 py-1 bg-zinc-600 text-white rounded-md hover:bg-zinc-700 transition-colors duration-200"
            >
                <span class="icon-[mdi--github] text-base"></span>
                <span>GitHub</span>
            </a>
      <a
                href="https://www.npmjs.com/package/mysql-gui"
                target="_blank"
                rel="noopener noreferrer"
                class="flex items-center space-x-1 rounded-md px-4 py-1 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors duration-200"
            >
                <span class="icon-[simple-icons--npm] text-base"></span>
                <span>NPM lib</span>
            </a>
        <a
                (click)="logout()"
                class="flex items-center space-x-1 rounded-md px-4 py-1 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors duration-200"
            >
                <span class="icon-[mdi--logout] text-base"></span>
                <span>Logout</span>
            </a>
    </div>
    </div>
    <div className="relative inline-block text-left">
        <div>
            <button (click)="toggleDropdown()" className="inline-flex justify-center w-full rounded-md 
                    border border-gray-300 shadow-sm px-4 py-2 bg-white 
                    text-sm font-medium text-gray-700 hover:bg-gray-50 
                    focus:outline-none">
                Options
                <svg className="ml-2 -mr-1 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" aria-hidden="true">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
        </div>

        <div *ngIf="isOpen" className="origin-top-right absolute right-0 mt-2 w-56 
                    rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5
                    focus:outline-none" role="menu">
            <div className="py-1" role="none">
                <a href="#" className="block px-4 py-2 text-sm text-gray-700 
                            hover:bg-gray-100" role="menuitem">
                    Account settings
                </a>
                <a href="#" className="block px-4 py-2 text-sm text-gray-700
                            hover:bg-gray-100" role="menuitem">
                    Support
                </a>
                <a href="#" className="block px-4 py-2 text-sm text-gray-700
                            hover:bg-gray-100" role="menuitem">
                    License
                </a>
            </div>
        </div>
    </div>
</header>
