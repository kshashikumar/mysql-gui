<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  <app-connection-card
    *ngFor="let conn of connections; trackBy: trackByConnectionId"
    [connection]="conn"
    (onSelect)="onConnectionSelect.emit($event)"
    (onEdit)="onEditConnection($event)"
    (onDelete)="onDeleteConnection($event)"
  ></app-connection-card>
</div>
