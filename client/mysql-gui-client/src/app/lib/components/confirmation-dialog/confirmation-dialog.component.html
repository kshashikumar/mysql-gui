<!-- src/app/lib/components/confirmation-dialog/confirmation-dialog.component.html -->
<div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 transition-opacity duration-300">
  <div class="bg-white rounded-lg p-6 w-full max-w-sm shadow-xl transform transition-all duration-300 scale-100">
    <h2 class="text-lg font-semibold mb-4 text-gray-800">Confirm Deletion</h2>
    <p class="text-gray-600 mb-6">{{ message }}</p>
    <div class="flex justify-end space-x-3">
      <button (click)="cancel()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors duration-200">Cancel</button>
      <button (click)="confirm()" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors duration-200">Delete</button>
    </div>
  </div>
</div>
